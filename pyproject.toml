[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdmods"
dynamic = ["version"]
description = "Keep a list of your Nexus Mods downloads and see which are outdated."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
cdmods = "cdmods.cli:main"

[tool.setuptools]
packages = ["cdmods"]

[tool.setuptools.dynamic]
version = { attr = "cdmods.__version__" }
